# Traducción entre ROS 2 y Gazebo para la simulación.
# Convención: /sim/* son los tópicos del simulador (los del robot real vendrán después).

# Órdenes de velocidad: de ROS hacia Gazebo
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/sim/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometría "verdadera" del simulador: de Gazebo hacia ROS
- ros_topic_name: "/sim/odom"
  gz_topic_name: "/sim/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Ultrasonidos simulados (láser de cono angosto): de Gazebo hacia ROS
- ros_topic_name: "/sim/ultrasonic/front/scan"
  gz_topic_name: "/sim/ultrasonic/front/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/ultrasonic/left/scan"
  gz_topic_name: "/sim/ultrasonic/left/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/ultrasonic/right/scan"
  gz_topic_name: "/sim/ultrasonic/right/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS