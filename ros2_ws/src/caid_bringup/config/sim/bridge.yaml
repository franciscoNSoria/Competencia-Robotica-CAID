# Traducción entre ROS 2 y Gazebo para la simulación.
# Convención: /sim/* son los tópicos del simulador (los del robot real vendrán después).

# Órdenes de velocidad: de ROS hacia Gazebo
- ros_topic_name: "/sim/cmd_vel"
  gz_topic_name: "/sim/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometría "verdadera" del simulador: de Gazebo hacia ROS
- ros_topic_name: "/sim/odom"
  gz_topic_name: "/sim/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Ultrasonidos simulados (láser de cono angosto): de Gazebo hacia ROS
- ros_topic_name: "/sim/ultrasonic/front/scan"
  gz_topic_name: "/sim/ultrasonic/front/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/ultrasonic/left/scan"
  gz_topic_name: "/sim/ultrasonic/left/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/ultrasonic/right/scan"
  gz_topic_name: "/sim/ultrasonic/right/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS


# Cámara simulada: de Gazebo hacia ROS
- ros_topic_name: "/sim/camera/image_raw"
  gz_topic_name: "/sim/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/sim/camera/camera_info"
  gz_topic_name: "/sim/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS


# Servo de la cámara: de ROS hacia Gazebo (posición en radianes)
- ros_topic_name: "/sim/camera_pan/cmd"
  gz_topic_name: "/sim/camera_pan/cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ


# Estado de las articulaciones: de Gazebo hacia ROS
- ros_topic_name: "/sim/joint_states"
  gz_topic_name: "/sim/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS


# Reloj de la simulación: de Gazebo hacia ROS
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS