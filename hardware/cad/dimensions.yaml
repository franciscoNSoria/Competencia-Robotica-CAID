# Cotas del robot. Unidades: milímetros, salvo que diga otra cosa.
# Fuente principal: ensamblado de Fusion 360 (hardware/cad/ensamblado/Robot_armadillo_armado.stl).
# Etiquetas al final de cada valor:
#   ensamblado  -> leído del ensamblado de Fusion
#   derivada    -> calculada a partir de otros valores (la cuenta está en el comentario)
#   provisorio  -> estimado; hay que medirlo en el robot armado
#
# Marco de referencia "chasis" (el origen de base_link):
#   origen = centro de la placa de arriba, sobre su cara SUPERIOR
#   x+ = hacia adelante, y+ = hacia la izquierda, z+ = hacia arriba
# (en el Fusion el frente es -x; acá se convirtió al estándar de ROS)

placa_acrilico:
  largo_x: 256.0             # ensamblado
  ancho_y: 150.0             # ensamblado
  espesor: 4.0               # ensamblado
  separacion_entre_placas: 56.0   # ensamblado (antes 55, medida a mano)

rueda:
  diametro: 67.0             # ensamblado
  radio: 33.5                # derivada: 67 / 2
  ancho: 25.0                # ensamblado
  cantidad: 4

tren_de_traccion:
  posicion_x_ruedas: [58.5, -62.5]   # ensamblado: [delanteras, traseras]
  trocha_centro_a_centro: 131.0      # ensamblado (centros a y = +-65.5)
  trocha_exterior: 156.0             # derivada: 131 + 25 (antes 150, medida a mano)
  batalla_centro_a_centro: 121.0     # derivada: 58.5 + 62.5

alturas_desde_el_piso:
  eje_de_rueda: 33.5         # derivada: = radio
  cara_inferior_piso_1: 44.5     # ensamblado: el eje de la rueda queda 11 mm por debajo
  cara_superior_piso_1: 48.5     # derivada: 44.5 + 4
  cara_inferior_piso_2: 104.5    # derivada: 48.5 + 56
  cara_superior_piso_2: 108.5    # derivada: 104.5 + 4  <- acá está el origen de base_link

paredes:                     # piezas 0-2-10 (frente) y 0-2-20 (fondo)
  frontal_sobresale: 11.9    # ensamblado: cara exterior en x = 139.9; el borde de la placa está en 128
  trasera_sobresale: 10.2    # ensamblado: cara exterior en x = -138.2
  ancho: 163.0               # ensamblado
  alto: 56.0                 # ensamblado

brazo:
  base_x: -21.3              # ensamblado: centro de la base del brazo en el marco base_link
  base_y: 0.0
  base_z: 0.0                # apoya sobre la cara superior del piso 2

  # Marco del brazo: origen en el centro de su base, sobre la cara superior del piso 2.
  # Mantiene la orientación del ensamblado: en la pose del ensamblado el brazo apunta
  # hacia +x de este marco (que es hacia atrás en el robot). z hacia arriba.
  # Las posiciones salen de los agujeros de los pasadores de las piezas (detección automática).
  eje_giro_z: 32.0           # altura del plato giratorio sobre la placa de arriba

  hombro:  {x: 0.0,   z: 66.7}     # eje del hombro (rotación alrededor de y)
  codo:    {x: 5.9,   z: 146.5}    # eje del codo
  muneca:  {x: 77.8,  z: 111.5}    # eje de la muñeca (donde se une la pinza)
  punta:   {x: 174.7, y: -4.0, z: 96.3}    # punta de la pinza: punto medio entre las dos garras
  garra_a: {x: 143.2, y: -4.3, z: 83.1}    # PROVISORIO: eje vertical de la garra, centro de su engranaje
  garra_b: {x: 129.8, y: 2.9,  z: 72.4}    # PROVISORIO: idem

camara:
  x: 94.0                    # ensamblado: eje del servo de giro (pieza 0-3-30)
  y: 0.0
  z: 30.0                    # ensamblado: centro de la caja de la cámara sobre el piso 2
  altura_desde_el_piso: 138.5    # derivada: 108.5 + 30 (la medición a mano dio 137.5)
  servo_pan: MG90S

sensores_ultrasonido:        # un frame por sensor, en el punto medio entre sus dos ojos
  frontal:
    x: 139.9                 # provisorio: cara exterior de la pared frontal
    y: 0.0
    z: -28.5                 # derivada: 31.5 mm sobre la cara superior del piso 1 (cara sup. piso 1 = -60)
    modelo: HC-SR04
  lateral_izquierdo:
    x: 96.0                  # medida: 32 mm del borde frontal de la placa
    y: 81.5                  # provisorio: cara exterior del brazo del paragolpes
    z: -34.75                # derivada: ojos a 11.5 y 39 mm sobre el piso 1 -> punto medio
    modelo: RCWL-9610A
  lateral_derecho:
    x: 96.0
    y: -81.5
    z: -34.75
    modelo: RCWL-9610A
  separacion_entre_ojos_laterales: 27.5   # derivada: 39 - 11.5

servos:
  modelo: MG90S

cubo:
  lado: 20.0
  masa_g: 9.9                # provisorio: PLA macizo; el real depende del relleno
